<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla de Multiplicar</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 30px;
      }

      .contenedor {
        background: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      input,
      button {
        padding: 10px;
        margin-top: 10px;
        width: 100%;
        font-size: 16px;
      }

      #resultado {
        margin-top: 20px;
        line-height: 1.8;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h2>Tabla de Multiplicar</h2>

      <input
        type="number"
        id="numero"
        placeholder="Ingrese número a multiplicar" />

      <button onclick="imprimirTablas()">Mostrar Tabla</button>

      <div id="resultado"></div>
    </div>

    <script>
      function imprimirTablas() {
        let numero = parseInt(document.getElementById('numero').value)

        let resultado = document.getElementById('resultado')

        resultado.innerHTML = ''

        if (isNaN(numero) || numero < 1 || numero > 100) {
          resultado.innerHTML =
            'Por favor, ingrese un número válido entre 1 y 100.'
          return
        }

        resultado.innerHTML += `<h3>Tabla del ${numero}</h3>`

        for (let i = 1; i <= 12; i++) {
          resultado.innerHTML += `${numero} x ${i} = ${numero * i}<br>`
        }
      }
    </script>
  </body>
</html>
